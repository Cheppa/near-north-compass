<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
      <meta name="theme-color" content="#0b1e19" />
        <title>Near North</title>
          <style>
              :root { --ink:#f2f5ed; --muted:#a7b4a8; --pine:#d6f26e; --card:#16332b; --night:#0b1e19; --orange:#ff9e5c; }
                  * { box-sizing:border-box }
                      body { margin:0; min-height:100svh; font-family:Inter,system-ui,sans-serif; color:var(--ink); background:radial-gradient(circle at 50% 28%,#1d4b3d 0,#102a23 40%,var(--night) 78%); }
                          main { width:min(100%,520px); min-height:100svh; margin:auto; padding:max(18px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:18px; }
                              header { display:flex; align-items:center; justify-content:space-between; }
                                  .brand { font-weight:800; letter-spacing:-.04em; font-size:1.28rem; } .dot { color:var(--pine); }
                                      .gps { border:0; border-radius:100px; padding:9px 12px; background:rgba(255,255,255,.1); color:var(--ink); font:600 .78rem inherit; display:flex; align-items:center; gap:7px; }
                                          .gps:before { content:""; width:8px; height:8px; border-radius:50%; background:var(--orange); }
                                              .gps.live:before { background:var(--pine); }
                                                  .place-label { color:var(--pine); text-transform:uppercase; font-size:.71rem; letter-spacing:.15em; font-weight:800; margin-top:7px; }
                                                      h1 { margin:5px 0 0; font-size:clamp(1.85rem,8vw,2.65rem); letter-spacing:-.06em; line-height:.98; }
                                                          .sub { margin:8px 0 0; color:var(--muted); font-size:.94rem; }
                                                              .compass-wrap { position:relative; align-self:center; width:min(78vw,350px); aspect-ratio:1; margin:3px 0 0; }
                                                                  .compass { position:absolute; inset:0; border-radius:50%; border:1px solid rgba(242,245,237,.18); background:radial-gradient(circle,#1f4d3d 0 43%,#173a30 44% 60%,#0d251e 61%); box-shadow:inset 0 0 35px rgba(0,0,0,.22),0 20px 50px rgba(0,0,0,.22); }
                                                                      .compass:before { content:""; position:absolute; inset:7%; border:1px solid rgba(242,245,237,.14); border-radius:50%; }
                                                                          .tick { position:absolute; left:50%; top:9%; height:7%; width:1px; background:rgba(242,245,237,.5); transform-origin:50% 584%; }
                                                                              .tick:nth-child(2){transform:rotate(45deg)} .tick:nth-child(3){transform:rotate(90deg)}
                                                                                  .tick:nth-child(4){transform:rotate(135deg)} .tick:nth-child(5){transform:rotate(180deg)}
                                                                                      .tick:nth-child(6){transform:rotate(225deg)} .tick:nth-child(7){transform:rotate(270deg)}
                                                                                          .tick:nth-child(8){transform:rotate(315deg)}
                                                                                              .cardinal { position:absolute; color:var(--muted); font-weight:800; font-size:.7rem; letter-spacing:.08em; }
                                                                                                  .n{top:11%;left:50%;transform:translateX(-50%);color:var(--pine)} .e{right:12%;top:50%;transform:translateY(-50%)}
                                                                                                      .s{bottom:11%;left:50%;transform:translateX(-50%)} .w{left:12%;top:50%;transform:translateY(-50%)}
                                                                                                          .needle { position:absolute; inset:16%; transition:transform .45s cubic-bezier(.2,.9,.15,1); transform:rotate(0deg); }
                                                                                                              .needle:before { content:""; position:absolute; left:calc(50% - 12px); top:0; border-left:12px solid transparent; border-right:12px solid transparent; border-bottom:48% solid var(--pine); }
                                                                                                                  .needle:after { content:""; position:absolute; left:calc(50% - 12px); bottom:0; border-left:12px solid transparent; border-right:12px solid transparent; border-top:48% solid #d4ded4; }
                                                                                                                      .hub { position:absolute; left:50%; top:50%; width:20px; aspect-ratio:1; border-radius:50%; transform:translate(-50%,-50%); background:var(--night); border:4px solid var(--ink); z-index:2; }
                                                                                                                          .distance { position:absolute; inset:35%; z-index:3; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; pointer-events:none; }
                                                                                                                              .distance strong { font-size:1.75rem; letter-spacing:-.07em; line-height:1; }
                                                                                                                                  .distance span { color:var(--muted); text-transform:uppercase; letter-spacing:.1em; font-size:.59rem; margin-top:4px; font-weight:800; }
                                                                                                                                      .selection { display:flex; gap:9px; justify-content:center; }
                                                                                                                                          .selection button,.types button { font:inherit; border:0; cursor:pointer; }
                                                                                                                                              .selection button { border-radius:100px; padding:10px 14px; background:rgba(255,255,255,.1); color:var(--ink); font-size:.8rem; font-weight:700; }
                                                                                                                                                  .selection button.active { background:var(--pine); color:#16332b; }
                                                                                                                                                      .selection button:disabled { opacity:.45; cursor:not-allowed; }
                                                                                                                                                          .types { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:auto; }
                                                                                                                                                              .types button { min-height:72px; border-radius:16px; background:rgba(255,255,255,.07); color:var(--ink); text-align:left; padding:11px; font-size:.78rem; font-weight:700; }
                                                                                                                                                                  .types button.active { background:var(--card); outline:1px solid rgba(214,242,110,.55); color:var(--pine); }
                                                                                                                                                                      .types .icon { display:block; font-size:1.2rem; margin-bottom:5px; }
                                                                                                                                                                          .status { text-align:center; color:var(--muted); font-size:.76rem; min-height:1.2em; }
                                                                                                                                                                              .error { color:#ffc59e; } .hint { color:var(--muted); font-size:.73rem; text-align:center; margin-top:-7px; }
                                                                                                                                                                                </style>
                                                                                                                                                                                </head>
                                                                                                                                                                                <body>
                                                                                                                                                                                  <main>
                                                                                                                                                                                      <header>
                                                                                                                                                                                            <div class="brand">near<span class="dot">•</span>north</div>
                                                                                                                                                                                                  <button class="gps" id="gpsBtn">Find my location</button>
                                                                                                                                                                                                      </header>

                                                                                                                                                                                                          <section>
                                                                                                                                                                                                                <div class="place-label" id="placeLabel">Nearest nature</div>
                                                                                                                                                                                                                      <h1 id="placeName">Forest</h1>
                                                                                                                                                                                                                            <p class="sub" id="placeDetail">Use your location to find what’s around you.</p>
                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                    <section class="compass-wrap">
                                                                                                                                                                                                                                          <div class="compass">
                                                                                                                                                                                                                                                  <i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i>
                                                                                                                                                                                                                                                          <i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i>
                                                                                                                                                                                                                                                                  <b class="cardinal n">N</b><b class="cardinal e">E</b>
                                                                                                                                                                                                                                                                          <b class="cardinal s">S</b><b class="cardinal w">W</b>
                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                      <div class="needle" id="needle"></div>
                                                                                                                                                                                                                                                                                            <div class="hub"></div>
                                                                                                                                                                                                                                                                                                  <div class="distance">
                                                                                                                                                                                                                                                                                                          <strong id="distance">—</strong>
                                                                                                                                                                                                                                                                                                                  <span id="distanceUnit">awaiting GPS</span>
                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                <div class="selection">
                                                                                                                                                                                                                                                                                                                                      <button class="active" id="nearestBtn">1st nearest</button>
                                                                                                                                                                                                                                                                                                                                            <button id="secondBtn" disabled>2nd nearest</button>
                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                    <div class="types" id="types"></div>
                                                                                                                                                                                                                                                                                                                                                        <div class="status" id="status">Allow location access to get started.</div>
                                                                                                                                                                                                                                                                                                                                                            <div class="hint">Keep your phone level for the clearest compass.</div>
                                                                                                                                                                                                                                                                                                                                                              </main>

                                                                                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                                                                                    const categories = {
                                                                                                                                                                                                                                                                                                                                                                          forest:  { label: "Forest", icon: "🌲", query: "natural=wood" },
                                                                                                                                                                                                                                                                                                                                                                                lake:    { label: "Lake", icon: "💧", query: "natural=water" },
                                                                                                                                                                                                                                                                                                                                                                                      station: { label: "Train station", icon: "🚆", query: "railway=station" },
                                                                                                                                                                                                                                                                                                                                                                                            liquor:  { label: "Liquor store", icon: "🍾", query: "shop=alcohol" },
                                                                                                                                                                                                                                                                                                                                                                                                  hotel:   { label: "Hotel", icon: "🛏️", query: "tourism=hotel" },
                                                                                                                                                                                                                                                                                                                                                                                                        park:    { label: "Park", icon: "🌿", query: "leisure=park" }
                                                                                                                                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                                                                                                                                const state = { lat:null, lon:null, heading:0, category:"forest", places:[], rank:0 };
                                                                                                                                                                                                                                                                                                                                                                                                                    const $ = id => document.getElementById(id);
                                                                                                                                                                                                                                                                                                                                                                                                                        const status = $("status");
                                                                                                                                                                                                                                                                                                                                                                                                                            const types = $("types");

                                                                                                                                                                                                                                                                                                                                                                                                                                Object.entries(categories).forEach(([key, category]) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                      const button = document.createElement("button");
                                                                                                                                                                                                                                                                                                                                                                                                                                            button.dataset.category = key;
                                                                                                                                                                                                                                                                                                                                                                                                                                                  button.innerHTML = `<span class="icon">${category.icon}</span>${category.label}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        button.onclick = () => chooseCategory(key);
                                                                                                                                                                                                                                                                                                                                                                                                                                                              types.appendChild(button);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function setStatus(message, error = false) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            status.textContent = message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  status.className = "status" + (error ? " error" : "");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function distanceText(meters) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return meters < 1000
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ? `${Math.round(meters)} m`
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                : `${(meters / 1000).toFixed(meters < 10000 ? 1 : 0)} km`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function haversine(lat1, lon1, lat2, lon2) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const r = Math.PI / 180;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const x = (lat2 - lat1) * r;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const y = (lon2 - lon1) * r;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const q = Math.sin(x / 2) ** 2 +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(y / 2) ** 2;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              return 6371e3 * 2 * Math.atan2(Math.sqrt(q), Math.sqrt(1 - q));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function bearing(lat1, lon1, lat2, lon2) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const r = Math.PI / 180;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const y = Math.sin((lon2 - lon1) * r) * Math.cos(lat2 * r);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const x = Math.cos(lat1 * r) * Math.sin(lat2 * r) -
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Math.sin(lat1 * r) * Math.cos(lat2 * r) * Math.cos((lon2 - lon1) * r);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      return (Math.atan2(y, x) / r + 360) % 360;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function render() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const category = categories[state.category];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const place = state.places[state.rank];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.querySelectorAll(".types button").forEach(button =>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        button.classList.toggle("active", button.dataset.category === state.category)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    $("placeLabel").textContent = `${state.rank ? "Second" : "Nearest"} ${category.label.toLowerCase()}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          $("nearestBtn").classList.toggle("active", !state.rank);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                $("secondBtn").classList.toggle("active", !!state.rank);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      $("secondBtn").disabled = state.places.length < 2;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!place) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    $("placeName").textContent = category.label;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            $("placeDetail").textContent = state.lat ? "Searching nearby…" : "Use your location to find what’s around you.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    $("distance").textContent = "—";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            $("distanceUnit").textContent = "awaiting GPS";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const meters = haversine(state.lat, state.lon, place.lat, place.lon);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const direction = bearing(state.lat, state.lon, place.lat, place.lon);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            $("placeName").textContent = place.name || category.label;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  $("placeDetail").textContent = place.address || `${category.label} nearby`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        $("distance").textContent = distanceText(meters);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              $("distanceUnit").textContent = "away";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    $("needle").style.transform = `rotate(${direction - state.heading}deg)`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            async function chooseCategory(key) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  state.category = key;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        state.rank = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              state.places = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    render();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (state.lat) await findPlaces();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  async function findPlaces() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const category = categories[state.category];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              setStatus(`Finding nearby ${category.label.toLowerCase()}s…`);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const [key, value] = category.query.split("=");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const query = `[out:json][timeout:18];(nwr[${key}=${value}](around:18000,${state.lat},${state.lon}););out center 12;`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const response = await fetch("https://overpass-api.de/api/interpreter", {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      method: "POST",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                body: query
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!response.ok) throw new Error("Place lookup failed");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const data = await response.json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                state.places = data.elements
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .map(item => ({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      lat: item.lat ?? item.center?.lat,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  lon: item.lon ?? item.center?.lon,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              name: item.tags?.name,
